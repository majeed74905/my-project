              '100%': { transform: 'translateX(100%)' }
            },

              '50%': { transform: 'rotateY(180deg)', opacity: '0.5' },

  <style>
    /* Critical CSS & Fixes */
    :root {
      --bg-color: #09090B;
      --surface-color: #18181B;
      --text-main: #FAFAFA;
      --primary: #8B5CF6;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
    }

    /* Ensure inputs and textareas always use the theme text color */
    input,
    textarea,
    select {
      color: var(--text-main);
    }

    /* Fix for invisible markdown letters */
    .markdown-body {
      color: var(--text-main);
    }

    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body strong {
      color: #FFFFFF;
    }

    .markdown-body p,
    .markdown-body li {
      color: var(--text-sub);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--surface-highlight);
      border-radius: 10px;
    }

    .glass-panel {
      background: var(--surface);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
    }
  </style>
